<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="한국어, 영어, 중국어를 지원하는 이미지 생성용 YAML 프롬프트 생성기">
  <title>Prompt Canvas — AI 이미지 프롬프트 생성기</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Cpath d='M14 45 27 31l9 9 15-19' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#17202d;--muted:#687386;--line:#dbe2ea;--soft:#f4f7fa;--paper:#fff;--navy:#172b4d;--blue:#2563eb;--blue2:#eaf1ff;--green:#0f9f6e;--shadow:0 14px 35px rgba(24,39,75,.09)}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;font:16px/1.45 Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;color:var(--ink);background:#edf2f7}
    button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
    .app{height:100vh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
    .topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);z-index:5}
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.02em}.mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#173b77,#2d6cdf);display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px rgba(37,99,235,.25)}.mark svg{width:20px}
    .top-actions{display:flex;align-items:center;gap:10px}.lang{min-width:132px;border:1px solid var(--line);border-radius:10px;padding:9px 34px 9px 12px;background:#fff}
    .ghost{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:700}.ghost:hover{background:var(--soft)}
    .workspace{display:grid;grid-template-columns:minmax(540px,1fr) minmax(430px,.86fr);min-height:0}
    .editor{overflow:auto;padding:22px 26px 60px;background:#fff;border-right:1px solid var(--line)}
    .output-wrap{min-width:0;padding:22px;background:#f3f6f9;display:flex;overflow:hidden}
    .intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:19px}.intro h1{font-size:24px;margin:0 0 4px;letter-spacing:-.035em}.intro p{margin:0;color:var(--muted);font-size:14px}
    .counter{white-space:nowrap;color:var(--blue);background:var(--blue2);font-size:13px;font-weight:800;padding:7px 10px;border-radius:99px}
    label.field-title,.section-label{display:block;font-weight:800;margin:0 0 8px}.field{margin-bottom:17px}
    input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff;outline:none;transition:.18s}textarea{min-height:88px;resize:vertical}input[type=text]:focus,textarea:focus{border-color:#7aa2f7;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
    .tools-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin:20px 0}.search{position:relative}.search input{padding-left:39px}.search svg{position:absolute;left:13px;top:13px;width:18px;color:#7b8798}
    .add-btn{border:0;border-radius:10px;background:var(--navy);color:#fff;padding:0 16px;font-weight:800}.add-btn:hover{background:#203e6e}
    .custom-area{display:none;border:1px dashed #aab8ca;border-radius:13px;padding:13px;margin:-8px 0 18px;background:#f8fafc}.custom-area.open{display:block}.custom-row{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px}.custom-row button{border:0;background:#e6ebf2;border-radius:9px;padding:0 13px;font-weight:800}.custom-note{font-size:13px;color:var(--muted);margin:8px 0 0}
    .category{border-top:1px solid var(--line)}.category:last-child{border-bottom:1px solid var(--line)}
    .cat-head{width:100%;display:flex;align-items:center;gap:10px;padding:18px 2px;border:0;background:transparent;text-align:left}.cat-head:hover .cat-title{color:var(--blue)}
    .cat-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#edf3fb;color:#244b82;font-size:17px}.cat-title{font-weight:850;flex:1}.cat-count{display:none;color:#fff;background:var(--blue);font-size:12px;font-weight:800;min-width:22px;height:22px;padding:2px 7px;border-radius:20px;text-align:center}.cat-count.on{display:block}.chev{width:18px;transition:.18s;color:#7c8898}.category.closed .chev{transform:rotate(-90deg)}.category.closed .cat-body{display:none}
    .cat-body{padding:0 2px 19px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{position:relative}.chip input{position:absolute;opacity:0;pointer-events:none}.chip label{display:inline-flex;align-items:center;min-height:38px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;font-size:14px;cursor:pointer;transition:.14s;user-select:none}.chip label:hover{border-color:#9bb5e8;background:#f8faff}.chip input:checked+label{border-color:#4d7fe5;background:#eaf1ff;color:#174ca8;box-shadow:inset 0 0 0 1px #4d7fe5;font-weight:750}.chip input:focus-visible+label{outline:3px solid rgba(37,99,235,.22)}
    .custom-option{display:flex;gap:8px;margin-top:10px}.custom-option input{flex:1}.custom-option button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 13px;font-weight:800}
    .empty{display:none;padding:35px 8px;text-align:center;color:var(--muted)}.empty.show{display:block}
    .result{width:100%;display:grid;grid-template-rows:auto auto 1fr auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
    .result-head{display:flex;align-items:center;justify-content:space-between;padding:17px 18px;border-bottom:1px solid var(--line)}.result-title{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:850}.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(15,159,110,.12)}
    .copy{display:flex;align-items:center;gap:7px;border:0;border-radius:10px;background:var(--blue);color:#fff;padding:9px 13px;font-size:14px;font-weight:800}.copy:hover{background:#1d4ed8}.copy svg{width:17px}
    .tabs{display:flex;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fbfcfe}.tab{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:7px 11px;font-size:13px;font-weight:800}.tab.on{color:#1e56b2;background:#eaf1ff}
    pre{margin:0;padding:20px;overflow:auto;background:#fff;color:#243244;font:14px/1.7 "SFMono-Regular",Consolas,monospace;white-space:pre-wrap;word-break:break-word}.result-foot{display:flex;justify-content:space-between;gap:12px;padding:11px 17px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;background:#fbfcfe}
    .toast{position:fixed;right:24px;bottom:24px;transform:translateY(20px);opacity:0;pointer-events:none;background:#172b4d;color:#fff;border-radius:11px;padding:11px 16px;font-weight:750;box-shadow:var(--shadow);transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:920px){.app{height:auto;min-height:100vh;overflow:visible}.workspace{grid-template-columns:1fr}.editor{overflow:visible;border-right:0;padding:20px 18px 36px}.output-wrap{padding:16px 18px 32px;min-height:540px}.topbar{position:sticky;top:0;padding:0 16px}.brand span:last-child{display:none}.result{min-height:500px}.intro{align-items:flex-start}.custom-row{grid-template-columns:1fr}.custom-row button{padding:10px}.lang{min-width:118px}.ghost{padding:9px 10px}}
    @media(max-width:520px){.topbar{height:62px}.intro h1{font-size:21px}.intro{display:block}.counter{display:inline-block;margin-top:10px}.top-actions{gap:6px}.lang{width:110px;min-width:0;padding-left:8px}.ghost{font-size:0}.ghost:after{content:"↺";font-size:19px}.chips{gap:7px}.chip label{font-size:13px}.result-foot{display:block}.result-foot span:last-child{display:none}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M5 18.5 9.2 14l3.1 3 6.7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 5h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="9" r="1.5" fill="currentColor"/></svg></div><span>Prompt Canvas</span></div>
    <div class="top-actions">
      <select id="language" class="lang" aria-label="언어 선택"><option value="ko">한국어</option><option value="en">English</option><option value="zh">繁體中文</option></select>
      <button class="ghost" id="reset">전체 초기화</button>
    </div>
  </header>
  <main class="workspace">
    <section class="editor">
      <div class="intro"><div><h1 data-t="title">AI 이미지 프롬프트 생성기</h1><p data-t="subtitle">원하는 항목을 선택하면 YAML 프롬프트가 완성됩니다.</p></div><span class="counter" id="counter">0개 선택</span></div>
      <div class="field"><label class="field-title" for="subject" data-t="subject">주제</label><input id="subject" type="text" placeholder="예: 비 오는 서울의 골목을 걷는 여성"></div>
      <div class="field"><label class="field-title" for="description" data-t="description">상세 설명</label><textarea id="description" placeholder="장면, 분위기, 인물에 대한 자유로운 설명을 입력하세요."></textarea></div>
      <div class="tools-row">
        <div class="search"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="search" type="text" placeholder="항목 검색"></div>
        <button class="add-btn" id="custom-toggle" data-t="addField">+ 사용자 정의 필드</button>
      </div>
      <div class="custom-area" id="custom-area">
        <div class="custom-row"><input id="custom-key" type="text" placeholder="필드 이름"><input id="custom-value" type="text" placeholder="필드 내용"><button id="custom-add" data-t="add">추가</button></div>
        <p class="custom-note" data-t="customNote">추가한 필드는 YAML 마지막에 표시됩니다.</p>
      </div>
      <div id="categories"></div>
      <div class="empty" id="empty" data-t="noResult">검색 결과가 없습니다.</div>
    </section>
    <aside class="output-wrap">
      <div class="result">
        <div class="result-head"><div class="result-title"><span class="live-dot"></span><span data-t="generated">생성된 프롬프트</span></div><button class="copy" id="copy"><svg viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="11" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="2"/></svg><span data-t="copy">복사</span></button></div>
        <div class="tabs"><button class="tab on">YAML</button><button class="tab" id="plain-tab" data-t="plain">한 줄 프롬프트</button></div>
        <pre id="output"></pre>
        <div class="result-foot"><span data-t="live">선택 내용이 실시간으로 반영됩니다.</span><span id="chars">0 characters</span></div>
      </div>
    </aside>
  </main>
</div>
<div class="toast" id="toast">클립보드에 복사했습니다.</div>
<script>

const DATA=window.PROMPT_DATA;
const safeStore={get:key=>{try{return sessionStorage.getItem(key)}catch{return null}},set:(key,value)=>{try{sessionStorage.setItem(key,value)}catch{}},clear:()=>{try{sessionStorage["clear"]()}catch{}}};
DATA.find(c=>c.key==="skirts").names.ko="스커트";
let lang="ko",customFields=[],plainMode=false;
const $=q=>document.querySelector(q), $$=q=>[...document.querySelectorAll(q)];
const esc=s=>String(s??"").replace(/\\/g,"\\\\").replace(/"/g,'\\"').replace(/\n/g,"\\n");
const slug=s=>s.trim().toLowerCase().replace(/\s+/g,"_").replace(/[^a-z0-9_\-\u3131-\uD79D\u3400-\u9FFF]/g,"");
function renderCategories(){
 const host=$("#categories");host.innerHTML="";
 DATA.forEach((cat,ci)=>{
  const box=document.createElement("section");box.className="category";box.dataset.search=[...Object.values(cat.names),...cat.options.flatMap(o=>Object.values(o))].join(" ").toLowerCase();
  box.innerHTML='<button class="cat-head" aria-expanded="true"><span class="cat-icon">'+cat.icon+'</span><span class="cat-title">'+cat.names[lang]+'</span><span class="cat-count"></span><svg class="chev" viewBox="0 0 24 24" fill="none"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><div class="cat-body"><div class="chips"></div><div class="custom-option"><input type="text" placeholder="'+UI[lang].customPH+'" aria-label="'+UI[lang].custom+'"><button>'+UI[lang].custom+'</button></div></div>';
  const chips=box.querySelector(".chips");
  cat.options.forEach((opt,oi)=>{
   const id="o-"+ci+"-"+oi,checked=safeStore.get(id)==="1";
   const d=document.createElement("div");d.className="chip";d.innerHTML='<input type="checkbox" id="'+id+'" data-cat="'+ci+'" data-opt="'+oi+'" '+(checked?"checked":"")+'><label for="'+id+'">'+opt[lang]+'</label>';chips.appendChild(d);
  });
  box.querySelector(".cat-head").onclick=()=>{box.classList.toggle("closed");box.querySelector(".cat-head").setAttribute("aria-expanded",!box.classList.contains("closed"))};
  const customInput=box.querySelector(".custom-option input");
  box.querySelector(".custom-option button").onclick=()=>{
   const val=customInput.value.trim();if(!val)return;
   const id="custom-"+Date.now();const d=document.createElement("div");d.className="chip";d.innerHTML='<input type="checkbox" checked id="'+id+'" data-cat="'+ci+'" data-custom="'+esc(val)+'"><label for="'+id+'">'+val+'</label>';chips.appendChild(d);customInput.value="";bindInputs();update();
  };
  customInput.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();box.querySelector(".custom-option button").click()}};
  host.appendChild(box);
 });
 bindInputs();filter();update();
}
function bindInputs(){$$("#categories input[type=checkbox]").forEach(x=>x.onchange=()=>{if(x.dataset.opt!==undefined)safeStore.set(x.id,x.checked?"1":"0");update()})}
function selected(){
 return DATA.map((cat,ci)=>{const vals=[];$$('input[data-cat="'+ci+'"]:checked').forEach(x=>{if(x.dataset.custom!==undefined)vals.push(x.dataset.custom);else vals.push(cat.options[+x.dataset.opt][lang])});return{key:cat.key,name:cat.names[lang],vals}}).filter(x=>x.vals.length);
}
function quote(s){return '"'+esc(s)+'"'}
function yaml(){
 const sub=$("#subject").value.trim()||UI[lang].emptySubject,desc=$("#description").value.trim(),parts=["subject: "+quote(sub)];
 if(desc)parts.push("description: "+quote(desc));
 selected().forEach(x=>{parts.push(x.key+":");x.vals.forEach(v=>parts.push("  - "+quote(v)))});
 customFields.forEach(x=>parts.push((slug(x.key)||"custom_field")+": "+quote(x.value)));
 return parts.join("\n");
}
function plain(){
 const vals=[$("#subject").value.trim(),$("#description").value.trim(),...selected().flatMap(x=>x.vals),...customFields.map(x=>x.value)].filter(Boolean);
 return vals.join(", ")||UI[lang].emptySubject;
}
function update(){
 const count=$$("#categories input[type=checkbox]:checked").length;
 $("#counter").textContent=UI[lang].selected(count);
 DATA.forEach((_,ci)=>{const box=$$(".category")[ci];if(!box)return;const n=box.querySelectorAll('input[type=checkbox]:checked').length,el=box.querySelector(".cat-count");el.textContent=n;el.classList.toggle("on",n>0)});
 const out=plainMode?plain():yaml();$("#output").textContent=out;$("#chars").textContent=out.length+" characters";
}
function setLanguage(next){
 lang=next;document.documentElement.lang=next==="zh"?"zh-Hant":next;
 $$("[data-t]").forEach(el=>el.textContent=UI[lang][el.dataset.t]);
 $("#subject").placeholder=UI[lang].subjectPH;$("#description").placeholder=UI[lang].descPH;$("#search").placeholder=UI[lang].searchPH;$("#custom-key").placeholder=UI[lang].keyPH;$("#custom-value").placeholder=UI[lang].valuePH;
 renderCategories();
}
function filter(){
 const q=$("#search").value.trim().toLowerCase();let visible=0;
 $$(".category").forEach(box=>{const show=!q||box.dataset.search.includes(q);box.style.display=show?"":"none";if(show)visible++});
 $("#empty").classList.toggle("show",visible===0);
}
$("#subject").oninput=update;$("#description").oninput=update;$("#search").oninput=filter;
$("#language").onchange=e=>setLanguage(e.target.value);
$("#custom-toggle").onclick=()=>{$("#custom-area").classList.toggle("open");if($("#custom-area").classList.contains("open"))$("#custom-key").focus()};
$("#custom-add").onclick=()=>{const key=$("#custom-key").value.trim(),value=$("#custom-value").value.trim();if(!key||!value)return;customFields.push({key,value});$("#custom-key").value="";$("#custom-value").value="";update()};
$("#custom-value").onkeydown=e=>{if(e.key==="Enter")$("#custom-add").click()};
$("#reset").onclick=()=>{if(!confirm(lang==="ko"?"모든 입력과 선택을 초기화할까요?":lang==="en"?"Reset every input and selection?":"要重設所有輸入與選項嗎？"))return;safeStore.clear();customFields=[];$("#subject").value="";$("#description").value="";$("#search").value="";renderCategories()};
$("#copy").onclick=async()=>{try{await navigator.clipboard.writeText($("#output").textContent)}catch(e){const r=document.createRange();r.selectNodeContents($("#output"));getSelection().removeAllRanges();getSelection().addRange(r);document.execCommand("copy");getSelection().removeAllRanges()}const t=$("#toast");t.textContent=UI[lang].copied;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1700)};
$("#plain-tab").onclick=()=>{plainMode=!plainMode;$$(".tab").forEach((x,i)=>x.classList.toggle("on",plainMode?i===1:i===0));update()};
setLanguage("ko");
